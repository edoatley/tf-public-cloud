name: Load Terraform Variables
description: >
  Export GitHub Actions variables into the environment for Terraform.
  Handles two special mappings (SSH_PUBLIC_KEY → TF_VAR_ssh_public_key with
  base64 decode; AZURE_SUBSCRIPTION_ID → TF_VAR_subscription_id) and
  forwards any variable already prefixed TF_VAR_* verbatim.

inputs:
  github_token:
    description: Token with variables:read permission (use secrets.GITHUB_TOKEN).
    required: true

runs:
  using: composite
  steps:
    - name: Export Terraform variables
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # SSH_PUBLIC_KEY → TF_VAR_ssh_public_key (base64-encoded in the variable)
        RAW=$(gh api "/repos/${GH_REPO}/actions/variables/SSH_PUBLIC_KEY" \
              --jq '.value' 2>/dev/null || true)
        if [ -n "$RAW" ]; then
          echo "TF_VAR_ssh_public_key=$(printf '%s' "$RAW" | base64 -d)" >> "$GITHUB_ENV"
        fi

        # AZURE_SUBSCRIPTION_ID → TF_VAR_subscription_id (plain value)
        SUB=$(gh api "/repos/${GH_REPO}/actions/variables/AZURE_SUBSCRIPTION_ID" \
              --jq '.value' 2>/dev/null || true)
        if [ -n "$SUB" ]; then
          echo "TF_VAR_subscription_id=${SUB}" >> "$GITHUB_ENV"
        fi

        # Any variable already named TF_VAR_* is forwarded verbatim
        gh api "/repos/${GH_REPO}/actions/variables" \
          --paginate \
          --jq '.variables[] | select(.name | startswith("TF_VAR_")) | "\(.name)=\(.value)"' \
          >> "$GITHUB_ENV" || true
