name: Cloud Login
description: Authenticate to AWS, GCP, or Azure using OIDC/workload identity.

inputs:
  cloud:
    description: Target cloud — aws, gcp, or azure.
    required: true
  aws_role_arn:
    description: IAM role ARN to assume (AWS only).
    required: false
  aws_region:
    description: AWS region (AWS only).
    required: false
  gcp_wif_provider:
    description: Workload Identity Federation provider (GCP only).
    required: false
  gcp_service_account:
    description: Service account email (GCP only).
    required: false
  azure_client_id:
    description: App registration client ID (Azure only).
    required: false
  azure_tenant_id:
    description: Azure tenant ID (Azure only).
    required: false
  azure_subscription_id:
    description: Azure subscription ID (Azure only).
    required: false

runs:
  using: composite
  steps:
    - name: Authenticate to AWS
      if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Authenticate to GCP
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: Authenticate to Azure
      if: inputs.cloud == 'azure'
      shell: bash
      run: |
        echo "ARM_CLIENT_ID=${{ inputs.azure_client_id }}"       >> "$GITHUB_ENV"
        echo "ARM_TENANT_ID=${{ inputs.azure_tenant_id }}"       >> "$GITHUB_ENV"
        echo "ARM_SUBSCRIPTION_ID=${{ inputs.azure_subscription_id }}" >> "$GITHUB_ENV"
        echo "ARM_USE_OIDC=true"                                  >> "$GITHUB_ENV"
