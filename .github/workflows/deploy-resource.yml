name: Deploy Resource

on:
  workflow_dispatch:
    inputs:
      resource_type:
        description: "Resource type to deploy"
        required: true
        type: choice
        options:
          - object-storage
          - virtual-machine
      cloud:
        description: "Cloud to target"
        required: true
        type: choice
        options:
          - aws
          - gcp
          - azure
          - all
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write
  actions: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # aws
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: "aws / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'aws' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Load Terraform variables
        uses: ./.github/actions/load-tf-vars
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: aws
          aws_role_arn: ${{ inputs.action == 'plan' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: aws/${{ inputs.resource_type }}
          action: ${{ inputs.action }}

  # ---------------------------------------------------------------------------
  # gcp
  # ---------------------------------------------------------------------------
  deploy-gcp:
    name: "gcp / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Load Terraform variables
        uses: ./.github/actions/load-tf-vars
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: gcp
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: gcp/${{ inputs.resource_type }}
          action: ${{ inputs.action }}
          extra_vars: -var="project=${{ vars.GCP_PROJECT_ID }}"

  # ---------------------------------------------------------------------------
  # azure
  # ---------------------------------------------------------------------------
  deploy-azure:
    name: "azure / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'azure' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Load Terraform variables
        uses: ./.github/actions/load-tf-vars
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: azure
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: azure/${{ inputs.resource_type }}
          action: ${{ inputs.action }}
