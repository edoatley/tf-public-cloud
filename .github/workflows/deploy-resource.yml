name: Deploy Resource

on:
  workflow_dispatch:
    inputs:
      resource_type:
        description: "Resource type to deploy"
        required: true
        type: choice
        options:
          - smoke-test
          - object-storage
          - virtual-machine
          - container-registry
          - containerised-app
          - serverless
      cloud:
        description: "Cloud to target"
        required: true
        type: choice
        options:
          - aws
          - gcp
          - azure
          - all
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_ssh_public_key_b64: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  # ---------------------------------------------------------------------------
  # aws — plan (no environment gate, read-only role)
  # ---------------------------------------------------------------------------
  deploy-aws-plan:
    name: "aws / ${{ inputs.resource_type }} / plan"
    if: (inputs.cloud == 'aws' || inputs.cloud == 'all') && inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: aws
          aws_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: aws/${{ inputs.resource_type }}
          action: plan

  # ---------------------------------------------------------------------------
  # aws — apply / destroy (environment gate required, write role)
  # ---------------------------------------------------------------------------
  deploy-aws-mutate:
    name: "aws / ${{ inputs.resource_type }} / ${{ inputs.action }}"
    if: (inputs.cloud == 'aws' || inputs.cloud == 'all') && inputs.action != 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: aws
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: aws/${{ inputs.resource_type }}
          action: ${{ inputs.action }}

  # ---------------------------------------------------------------------------
  # gcp
  # ---------------------------------------------------------------------------
  deploy-gcp:
    name: "gcp / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_VAR_ci_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: gcp
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: gcp/${{ inputs.resource_type }}
          action: ${{ inputs.action }}
          extra_vars: -var="project=${{ vars.GCP_PROJECT_ID }}"

  # ---------------------------------------------------------------------------
  # azure — plan (default environment, read-only app registration)
  # ---------------------------------------------------------------------------
  deploy-azure-plan:
    name: "azure / ${{ inputs.resource_type }} / plan"
    if: (inputs.cloud == 'azure' || inputs.cloud == 'all') && inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: azure
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: azure/${{ inputs.resource_type }}
          action: plan

  # ---------------------------------------------------------------------------
  # azure — apply / destroy (production environment gate, write app registration)
  # ---------------------------------------------------------------------------
  deploy-azure-mutate:
    name: "azure / ${{ inputs.resource_type }} / ${{ inputs.action }}"
    if: (inputs.cloud == 'azure' || inputs.cloud == 'all') && inputs.action != 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: azure
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: azure/${{ inputs.resource_type }}
          action: ${{ inputs.action }}
