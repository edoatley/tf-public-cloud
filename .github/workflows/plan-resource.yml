name: Plan Resource

on:
  workflow_dispatch:
    inputs:
      resource_type:
        description: "Resource type to plan"
        required: true
        type: choice
        options:
          - smoke-test
          - object-storage
          - virtual-machine
          - container-registry
          - containerised-app
          - containerised-app-prod
          - serverless
          - private-service-connect
      cloud:
        description: "Cloud to target"
        required: true
        type: choice
        options:
          - aws
          - gcp
          - azure
          - all

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_ssh_public_key_b64: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  # ---------------------------------------------------------------------------
  # aws — read-only role, no environment gate
  # ---------------------------------------------------------------------------
  plan-aws:
    name: "aws / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'aws' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: aws
          aws_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: aws/${{ inputs.resource_type }}
          action: plan

  # ---------------------------------------------------------------------------
  # gcp — read-only service account, default environment
  # ---------------------------------------------------------------------------
  plan-gcp:
    name: "gcp / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default
    env:
      TF_VAR_ci_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: gcp
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: gcp/${{ inputs.resource_type }}
          action: plan
          extra_vars: -var="project=${{ vars.GCP_PROJECT_ID }}"

  # ---------------------------------------------------------------------------
  # azure — read-only app registration, default environment
  # ---------------------------------------------------------------------------
  plan-azure:
    name: "azure / ${{ inputs.resource_type }}"
    if: inputs.cloud == 'azure' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: azure
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Terraform
        uses: ./.github/actions/terraform-run
        with:
          module_path: azure/${{ inputs.resource_type }}
          action: plan
