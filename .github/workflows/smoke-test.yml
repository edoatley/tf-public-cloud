name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to smoke-test"
        required: true
        type: choice
        options:
          - aws
          - gcp
          - azure
          - all

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  smoke-test-aws:
    name: Smoke test (aws)
    if: inputs.cloud == 'aws' || inputs.cloud == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: aws
          aws_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: aws/smoke-test

      - name: terraform plan
        run: terraform plan -no-color -lock=false
        working-directory: aws/smoke-test

      - name: Write summary
        if: success()
        run: |
          echo "## Smoke test passed: \`aws\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform init\` connected to remote state backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform plan\` resolved data sources successfully" >> "$GITHUB_STEP_SUMMARY"

  smoke-test-gcp:
    name: Smoke test (gcp)
    if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: gcp
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: gcp/smoke-test

      - name: terraform plan
        run: terraform plan -no-color -lock=false -var="project=${{ vars.GCP_PROJECT_ID }}"
        working-directory: gcp/smoke-test

      - name: Write summary
        if: success()
        run: |
          echo "## Smoke test passed: \`gcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform init\` connected to remote state backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform plan\` resolved data sources successfully" >> "$GITHUB_STEP_SUMMARY"

  smoke-test-azure:
    name: Smoke test (azure)
    if: inputs.cloud == 'azure' || inputs.cloud == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: azure
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false
        working-directory: azure/smoke-test

      - name: terraform plan
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -no-color -lock=false
        working-directory: azure/smoke-test

      - name: Write summary
        if: success()
        run: |
          echo "## Smoke test passed: \`azure\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform init\` connected to remote state backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`terraform plan\` resolved data sources successfully" >> "$GITHUB_STEP_SUMMARY"
