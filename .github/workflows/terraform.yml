name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Relative path to the example module, e.g. aws/object-storage"
        required: true
        type: string
  pull_request:
    paths:
      - "aws/**/*.tf"
      - "gcp/**/*.tf"
      - "azure/**/*.tf"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "aws/**/*.tf"
      - "gcp/**/*.tf"
      - "azure/**/*.tf"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS_plan: "-input=false"
  TF_VAR_ssh_public_key_b64: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  # ---------------------------------------------------------------------------
  # detect: resolve which modules changed and build a matrix
  # ---------------------------------------------------------------------------
  detect:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      skip: ${{ steps.build.outputs.skip }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed Terraform files
        id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v47
        with:
          dir_names: true
          dir_names_max_depth: 2
          files: |
            aws/**/*.tf
            gcp/**/*.tf
            azure/**/*.tf
          matrix: true

      - name: Build module matrix
        id: build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FOLDER="${{ inputs.folder }}"
            CLOUD=$(echo "$FOLDER" | cut -d'/' -f1)
            MATRIX="[{\"module_path\":\"$FOLDER\",\"cloud\":\"$CLOUD\"}]"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            DIRS='${{ steps.changed.outputs.all_changed_files }}'
            if [ "$DIRS" = "[]" ] || [ -z "$DIRS" ]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              MATRIX=$(echo "$DIRS" | jq -c '[.[] | {module_path: ., cloud: (split("/")[0])}]')
              echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ---------------------------------------------------------------------------
  # validate: init, fmt check, validate, tflint — one job per changed module
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (${{ matrix.module_path }})
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    environment: default
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform and authenticate
        uses: ./.github/actions/terraform-setup
        with:
          cloud: ${{ matrix.cloud }}
          aws_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: ${{ matrix.module_path }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.module_path }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ matrix.module_path }}

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      - name: tflint
        run: |
          tflint --init --chdir "${{ matrix.module_path }}"
          tflint --chdir "${{ matrix.module_path }}"

  # ---------------------------------------------------------------------------
  # trivy: IaC misconfiguration + secrets scan across the whole repo
  # Runs independently of detect/validate so it fires on workflow-only PRs too.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: config,secret
          exit-code: 0
          severity: HIGH,CRITICAL
          format: table
          output: trivy-results.txt

      - name: Summarise Trivy results
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('trivy-results.txt')
              ? fs.readFileSync('trivy-results.txt', 'utf8').trim()
              : '';

            // Count findings by severity
            const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
            for (const [sev] of raw.matchAll(/\b(CRITICAL|HIGH|MEDIUM|LOW)\b/g)) counts[sev]++;
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            const badge = total === 0 ? '✅ No findings' :
              `⚠️ ${total} finding(s): CRITICAL=${counts.CRITICAL} HIGH=${counts.HIGH} MEDIUM=${counts.MEDIUM} LOW=${counts.LOW}`;

            // Write full results to job summary
            await core.summary
              .addHeading('Trivy scan')
              .addRaw(badge + '\n\n')
              .addCodeBlock(raw || 'No findings.', 'text')
              .write();

            // Post a short count comment on PRs
            if (context.eventName !== 'pull_request') return;
            const marker = '<!-- trivy-scan -->';
            const body = `${marker}\n**Trivy scan:** ${badge}\n\nFull results in the [job summary](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
