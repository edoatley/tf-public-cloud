name: Test Cloud Authentication

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to test"
        required: true
        type: choice
        options:
          - aws
          - gcp
          - azure
          - all

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    name: Test AWS OIDC auth
    if: inputs.cloud == 'aws' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [plan, apply]
    steps:
      - name: Authenticate (plan role)
        if: matrix.role == 'plan'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate (apply role)
        if: matrix.role == 'apply'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify identity
        run: |
          echo "### AWS auth check — ${{ matrix.role }} role" >> "$GITHUB_STEP_SUMMARY"
          aws sts get-caller-identity | tee -a "$GITHUB_STEP_SUMMARY"

  test-gcp:
    name: Test GCP OIDC auth
    if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Verify identity
        run: |
          echo "### GCP auth check" >> "$GITHUB_STEP_SUMMARY"
          gcloud auth print-identity-token --audiences="${{ vars.GCP_WIF_PROVIDER }}" | head -c 60
          echo ""
          gcloud config get-value account | tee -a "$GITHUB_STEP_SUMMARY"

  test-azure:
    name: Test Azure OIDC auth
    if: inputs.cloud == 'azure' || inputs.cloud == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify identity
        run: |
          echo "### Azure auth check" >> "$GITHUB_STEP_SUMMARY"
          az account show --query '{subscription:id, tenant:tenantId, user:user.name}' | tee -a "$GITHUB_STEP_SUMMARY"
